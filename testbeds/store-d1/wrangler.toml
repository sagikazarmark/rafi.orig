# Local only: runs rafi-store's scenarios against D1 (see src/lib.rs).
name = "rafi-store-d1-check"
main = "build/index.js"
compatibility_date = "2026-05-01"

[build]
command = "worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "rafi-store-check"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../migrations/sqlite"
