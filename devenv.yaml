# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  nixpkgs-multiverse:
    url: github:fzakaria/nixpkgs-multiverse
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  extras:
    url: github:sagikazarmark/devenv-extras
    overlays:
      - default
  nix-restate:
    url: github:sagikazarmark/nix-restate
    inputs:
      nixpkgs:
        follows: nixpkgs
    overlays:
      - default

imports:
  - extras/modules

nixpkgs:
  permitted_unfree_packages:
    - restate-bin
    - google-chrome
