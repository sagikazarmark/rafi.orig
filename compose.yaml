# Local Restate server for development. The app and the `restate-rafi` draw
# engine run on the host (see the README); Restate reaches the engine at
# http://host.docker.internal:9080.
services:
  restate:
    image: docker.restate.dev/restatedev/restate:1.7.13
    ports:
      - 127.0.0.1:${RESTATE_INGRESS_PORT:-8080}:8080 # ingress (the app's RESTATE_INGRESS_URL)
      - 127.0.0.1:${RESTATE_ADMIN_PORT:-9070}:9070 # admin API and UI
    extra_hosts:
      - host.docker.internal:host-gateway # for Linux; Docker Desktop has it built in
    volumes:
      - restate-data:/restate-data

volumes:
  restate-data:
