[package]
name = "altcha-server"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
description = "The server's side of ALTCHA v2 proof-of-work: issuing signed challenges and redeeming each solution once, over a replay store you provide"
readme = "README.md"
keywords = ["altcha", "captcha", "proof-of-work", "axum"]
categories = ["web-programming", "authentication"]
publish = false

# Versions are explicit (not `workspace = true`) so the crate can move out of
# this workspace unchanged.

[features]
default = []
## A challenge handler for axum.
axum = ["dep:axum"]

[dependencies]
altcha = "1"
axum = { version = "0.8", default-features = false, features = ["json"], optional = true }
base64 = "0.23"
serde_json = "1"
thiserror = "2"
# Clocks that work on wasm32-unknown-unknown (Cloudflare Workers) too.
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `altcha` uses rand 0.8's thread_rng, which needs getrandom 0.2's JS backend
# to build for wasm32-unknown-unknown.
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
altcha-server = { path = ".", features = ["axum"] }
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
