[package]
name = "restate-rafi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The Rafi draw engine: the `Raffle` Restate virtual object"
publish = false

[dependencies]
rafi-core.workspace = true
rafi-drand = { path = "../drand" }
anyhow = "1"
getrandom = "0.3"
rafi-store.workspace = true
restate-ext = "0.3"
restate-sdk = { workspace = true }
serde.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tracing = "0.1"

[dev-dependencies]
rafi-drand = { path = "../drand", features = ["mock"] }
restate-e2e-harness = "0.3"
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
