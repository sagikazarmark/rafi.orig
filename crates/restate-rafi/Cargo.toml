[package]
name = "restate-rafi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The Rafi draw engine: the `Raffle` Restate virtual object"
publish = false

[dependencies]
rafi-core.workspace = true
rafi-drand = { path = "../drand" }
restate-drand = { workspace = true }
anyhow = "1"
getrandom = "0.3"
rafi-store.workspace = true
restate-sdk = { workspace = true }
serde.workspace = true
tracing = "0.1"

# The SQLite projector (self-hosting); on Workers the projector writes D1.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
rafi-drand = { path = "../drand", features = ["mock"] }
restate-e2e-harness = "0.3"
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
