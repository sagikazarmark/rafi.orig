[package]
name = "restate-rafi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The Rafi draw engine: the `Drawing` Restate virtual object"
publish = false

[dependencies]
rafi-drawing.workspace = true
rafi-drand = { path = "../drand" }
restate-drand = { workspace = true }
anyhow = "1"
getrandom = "0.3"
rafi-platform = { path = "../platform" }
restate-sdk = { workspace = true }
serde.workspace = true
tracing = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
rafi-drand = { path = "../drand", features = ["mock"] }
rafi-engine-local = { path = "../engine-local", features = ["conformance"] }
restate-rafi-client = { path = "../restate-rafi-client" }
restate-e2e-harness = "0.3"
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
