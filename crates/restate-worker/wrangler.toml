# Local development: the Restate Worker next to crates/channel-check, which
# hosts the RaffleChannel objects and shares this D1 (run both with the same
# --persist-to). Production configuration comes with the deployment setup.
name = "rafi-restate"
main = "build/index.js"
compatibility_date = "2026-05-01"

[build]
command = "worker-build --release --features dev"

[[d1_databases]]
binding = "DB"
database_name = "rafi-channel-check"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "../../migrations"

[[durable_objects.bindings]]
name = "RAFFLE_CHANNEL"
class_name = "RaffleChannel"
script_name = "rafi-channel-check"

[vars]
# workerd doesn't implement jurisdictions; production uses "eu".
RAFI_DO_JURISDICTION = ""
RAFI_DRAND_MOCK = "1"
RAFI_DRAND_LEAD_SECS = "3"
