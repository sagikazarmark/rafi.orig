[package]
name = "rafi-restate-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The Rafi draw engine (the `Raffle` Restate virtual object) as a Cloudflare Worker"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
## Development only: accept requests without Restate identity keys, and allow
## `RAFI_DRAND_MOCK=1` (a public test chain). Never in a release build.
dev = ["rafi-engine/mock-drand"]

[dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]
anyhow = "1"
http = "1"
http-body-util = "0.1"
rafi-cloudflare = { workspace = true }
rafi-platform = { workspace = true }
rafi-store = { workspace = true }
rafi-engine = { workspace = true, features = ["drand"] }
rafi-engine-restate = { workspace = true }
rafi-raffle = { workspace = true }
restate-sdk = { workspace = true, features = ["rust_crypto"] }
worker = { version = "0.8.7", features = ["http"] }
