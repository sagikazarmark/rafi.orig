[package]
name = "rafi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Live, verifiable meetup raffles"
publish = false

# `cdylib` for Cloudflare Workers (worker-build, the `worker` feature).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rafi-lifecycle = { workspace = true }
rafi-raffle = { workspace = true }
rafi-model = { workspace = true }
rafi-pages = { workspace = true }
rafi-store = { workspace = true, optional = true }
rafi-altcha = { workspace = true, optional = true }
rafi-live-client = { workspace = true, features = ["card"] }
rafi-live-server = { workspace = true, optional = true }
rafi-engine = { workspace = true, optional = true }
# The web app adds `launch`, `web`, `devtools` and `logger`.
dioxus = { version = "=0.7.10", default-features = false, features = ["router", "lib"] }
dioxus-clerk = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
uuid = { version = "1", features = ["v4", "js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
futures-util = "0.3"
dioform = { version = "0.7", features = ["dioxus-field"] }

# Server only (native and Workers)
axum = { version = "0.8", default-features = false, features = ["form", "json", "query", "matched-path", "original-uri"], optional = true }
rafi-engine-restate = { workspace = true, optional = true }
rafi-app-core = { workspace = true, optional = true }
tracing = { version = "0.1", optional = true }
anyhow = { version = "1", optional = true }
thiserror = { workspace = true, optional = true }

# Web only
web-sys = { version = "0.3", features = ["Window", "Document", "EventTarget", "Node", "VisibilityState", "Element", "HtmlElement", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Location", "Navigator", "Crypto"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"], optional = true }
partyline-dioxus = { version = "0.3", optional = true }
dioxus-field = { version = "0.7.0", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955", version = "0.0.1", default-features = false, features = ["router"] }

# The native server's runtime.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }

# Cloudflare Workers (the `worker` feature).
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8.7", features = ["http", "axum"], optional = true }
tower-service = { version = "0.3", optional = true }
rafi-cloudflare = { workspace = true, optional = true }
http = { version = "1", optional = true }

[dev-dependencies]
rafi-raffle = { workspace = true, features = ["mock-chain"] }
rafi-engine = { workspace = true, features = ["local", "mock-drand"] }
restate-e2e-harness = "0.3"
restate-sdk = { workspace = true }
dioxus-clerk = { version = "0.6", features = ["server", "testing"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
default = []
## Allow `RAFI_DRAND_CHAIN=mock` (or `RAFI_DRAND_MOCK=1`): raffles commit to a
## public test chain (offline development). Release builds refuse it.
mock-drand = ["rafi-raffle/mock-chain"]
web = [
    "dioxus/web",
    "dioxus/launch",
    "dioxus/devtools",
    "dioxus/logger",
    "dep:web-sys",
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:gloo-timers",
    "dep:gloo-net",
    "dep:partyline-dioxus",
]
# The native server: participant pages (rendered by rafi-pages), the admin's JSON routes, the web app's files.
server = [
    "dioxus-clerk/server",
    "dep:tokio",
    "dep:axum",
    "dep:tower-http",
    "dep:rafi-engine-restate",
    "dep:rafi-app-core",
    "dep:rafi-store",
    "dep:rafi-live-server",
    "dep:rafi-altcha",
    "rafi-altcha/server",
    "dep:rafi-engine",
    "dep:tracing",
    "dep:anyhow",
    "dep:thiserror",
]
# The app on Cloudflare Workers: `server` plus the Worker entry points
# (fetch, the Cron, the RaffleRoom Durable Object). Build with worker-build.
worker = [
    "server",
    "dep:worker",
    "dep:rafi-cloudflare",
    "dep:tower-service",
    "dep:js-sys",
    "dioxus-clerk/worker",
    "dep:http",
]
## Local development on Workers only: allows RAFI_DEV_AUTH and RAFI_DRAND_CHAIN=mock.
worker-dev = ["worker", "mock-drand"]
