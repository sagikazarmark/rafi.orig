[package]
name = "rafi-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "What the Rafi app does, without HTTP: the organizer's and the participants' use cases over the store, the raffle engine and the live notifier, and the join's rate limits"
publish = false

[dependencies]
anyhow = { workspace = true }
altcha-server = { workspace = true }
getrandom = { version = "0.4", features = ["wasm_js"] }
hex = { workspace = true }
rafi-raffle = { workspace = true }
rafi-engine = { workspace = true }
rafi-live-client = { workspace = true }
rafi-live-server = { workspace = true }
rafi-api = { workspace = true }
rafi-lifecycle = { workspace = true }
rafi-store = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
altcha = { workspace = true }
rafi-engine = { workspace = true, features = ["local", "mock-drand"] }
# Interleavings: a second actor between two of a use case's statements.
rafi-store = { workspace = true, features = ["hooks"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
