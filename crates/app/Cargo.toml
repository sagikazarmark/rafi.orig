[package]
name = "rafi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Live, verifiable meetup raffles"
publish = false

[dependencies]
rafi-core.workspace = true
rafi-drand = { path = "../drand", optional = true }
rafi-store = { workspace = true, optional = true }
dioxus = { version = "=0.7.10", features = ["router", "fullstack"] }
dioxus-clerk = "0.6"
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
uuid = { version = "1", features = ["v4", "js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
futures-util = "0.3"
dioform = { version = "0.7", features = ["dioxus-field"] }

# Server only
tokio = { version = "1", features = ["full"], optional = true }
tokio-stream = { version = "0.1", features = ["sync", "time"], optional = true }
futures = { version = "0.3", optional = true }
axum = { version = "0.8", optional = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
hmac = { version = "0.13", optional = true }
base64 = { version = "0.23", optional = true }
tracing = { version = "0.1", optional = true }
anyhow = { version = "1", optional = true }
thiserror = { workspace = true, optional = true }

# Web only
web-sys = { version = "0.3", features = ["EventSource", "MessageEvent", "Window", "Document", "Element", "HtmlElement", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Location", "Navigator", "Crypto"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
gloo-timers = { version = "0.4", features = ["futures"], optional = true }
dioxus-field = { version = "0.7.0", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955", version = "0.0.1", default-features = false, features = ["router"] }

[dev-dependencies]
restate-rafi = { path = "../restate-rafi" }
restate-e2e-harness = "0.3"
restate-sdk = { workspace = true }
dioxus-clerk = { version = "0.6", features = ["server", "testing"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
default = []
web = ["dioxus/web", "dep:web-sys", "dep:wasm-bindgen", "dep:js-sys", "dep:gloo-timers"]
server = [
    "dioxus/server",
    "dioxus-clerk/server",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:futures",
    "dep:axum",
    "dep:sqlx",
    "dep:reqwest",
    "dep:rafi-drand",
    "dep:rafi-store",
    "dep:hmac",
    "dep:base64",
    "dep:tracing",
    "dep:anyhow",
    "dep:thiserror",
]
