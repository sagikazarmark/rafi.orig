[package]
name = "rafi-cloudflare"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rafi on Cloudflare Workers: the per-raffle RaffleRoom Durable Object, the live notifier over it, and the Workers bindings Rafi reads"
publish = false

# Everything here is Workers glue: the crate is empty on other targets.
[target.'cfg(target_arch = "wasm32")'.dependencies]
anyhow = { workspace = true }
js-sys = { workspace = true }
partyline-worker = "0.3"
rafi-engine = { workspace = true }
rafi-lifecycle = { workspace = true }
rafi-live-client = { workspace = true }
rafi-live-server = { workspace = true }
rafi-raffle = { workspace = true }
rafi-store = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
worker = { workspace = true }
