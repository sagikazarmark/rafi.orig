[package]
name = "rafi-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The interfaces a Rafi deployment provides: live-update notifications (also as the drawing engine's notifier) and rate limits"
publish = false

[dependencies]
anyhow = "1"
rafi-drawing.workspace = true
rafi-engine = { path = "../engine" }
rafi-live = { path = "../live" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
