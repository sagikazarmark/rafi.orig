[package]
name = "rafi-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The interfaces a Rafi deployment provides (live-update notifications, rate limits, the draw engine's store) and the live channel's publish rule"
publish = false

[dependencies]
anyhow = "1"
rafi-core.workspace = true
rafi-live = { path = "../live" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
