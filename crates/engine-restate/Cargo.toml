[package]
name = "rafi-engine-restate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The Rafi raffle engine on Restate: the `Raffle` virtual object, and the app's `Engine` over the ingress"
publish = false

[dependencies]
anyhow = "1"
rafi-raffle = { workspace = true }
restate-drand = { workspace = true }
rafi-engine = { workspace = true, features = ["drand"] }
rafi-platform = { workspace = true }
restate-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"

# The app's client: the SDK's generated ingress clients over reqwest.
bytes = "1"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# wasm32: reqwest has no timeouts there, so synchronous calls race a timer.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = { version = "0.3", default-features = false }
gloo-timers = { version = "0.3", features = ["futures"] }

[dev-dependencies]
rafi-raffle = { workspace = true, features = ["mock-chain"] }
rafi-engine = { workspace = true, features = ["conformance"] }
restate-e2e-harness = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
