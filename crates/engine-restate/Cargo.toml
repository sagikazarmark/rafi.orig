[package]
name = "rafi-engine-restate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The Rafi drawing engine on Restate: the `Drawing` virtual object, and the app's `DrawingEngine` over the ingress"
publish = false

[dependencies]
anyhow = "1"
rafi-drawing.workspace = true
rafi-drand = { path = "../drand" }
restate-drand = { workspace = true }
rafi-engine = { path = "../engine" }
rafi-platform = { path = "../platform" }
restate-sdk = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"

# The app's client: the SDK's generated ingress clients over reqwest.
bytes = "1"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
rafi-drand = { path = "../drand", features = ["mock"] }
rafi-engine = { path = "../engine", features = ["conformance"] }
restate-e2e-harness = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
