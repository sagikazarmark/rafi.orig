[package]
name = "rafi-drand"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rafi's drand configuration: chain, relays and timing on top of drand"
publish = false

[features]
## Allow `mock = true`: a signing test chain with a public seed (development and tests).
mock = ["drand/test-chain", "rafi-raffle/mock-chain"]

[dependencies]
anyhow = "1"
drand = { workspace = true, features = ["client", "rustls", "bls12-381"] }
rafi-raffle.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt"] }
