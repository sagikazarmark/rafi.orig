[package]
name = "rafi-pages"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rafi's public pages, rendered on the server (the participant page, the rules, the privacy notice), linking the web app's stylesheet"
publish = false

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals", "ssr"] }
dioxus-icons = "=0.1.0"
rafi-lifecycle = { workspace = true }
rafi-live-client = { workspace = true, features = ["card"] }
serde = { workspace = true }
serde_json = { workspace = true }
