[package]
name = "rafi-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rafi's web app: the organizer's admin, the projector screen and the verification page (Dioxus, `dx bundle --platform web`)"
publish = false

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["router", "lib", "web", "launch", "devtools", "logger"] }
dioxus-clerk = "0.6"
dioxus-field = { version = "0.7.0", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955", version = "0.0.1", default-features = false, features = ["router"] }
dioform = { version = "0.7", features = ["dioxus-field"] }
futures-util = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
partyline-dioxus = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rafi-lifecycle = { workspace = true }
rafi-live-client = { workspace = true, features = ["card"] }
rafi-model = { workspace = true }
rafi-pages = { workspace = true }
rafi-raffle = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4", "js"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "EventTarget", "Node", "VisibilityState", "Element", "HtmlElement", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Location", "Navigator", "Crypto"] }
