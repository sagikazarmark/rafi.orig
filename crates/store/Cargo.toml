[package]
name = "rafi-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rafi's database: all of its SQL, as domain functions over SQLite and Postgres (native) and D1 (Workers), including the draw state write shared by the app and the draw engine, and the participant snapshot"
publish = false

[features]
default = ["postgres"]
## PostgreSQL as a native backend (`postgres://` database URLs), for
## self-hosting, with TLS (rustls, Mozilla roots). Native only: Workers use
## D1, and ignore it. Without it, rafi-store builds only SQLite natively.
postgres = ["sqlx/postgres", "sqlx/tls-rustls-aws-lc-rs", "dep:tokio"]
## The shared backend scenarios (`testsuite`), for running against D1.
testsuite = []

[dependencies]
anyhow = "1"
rafi-core.workspace = true
rafi-live = { path = "../live" }
rafi-platform = { path = "../platform" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Native: SQLite (and Postgres) through sqlx (self-hosting, development, tests).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
# Postgres retries a serialization failure after a short sleep.
tokio = { version = "1", features = ["time"], optional = true }

# Cloudflare Workers: D1.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8.7", features = ["d1"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
