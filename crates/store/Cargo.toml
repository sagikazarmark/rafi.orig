[package]
name = "rafi-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rafi's SQLite database: schema, connection options, and the draw state write shared by the app and the draw engine"
publish = false

[dependencies]
rafi-core.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
