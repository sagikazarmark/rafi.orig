[package]
name = "rafi-live-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The server side of live updates: the notifier a deployment pushes them through, the participant view of a raffle (from the store's snapshot) and when a live channel publishes it"
publish = false

[dependencies]
anyhow = { workspace = true }
rafi-engine = { workspace = true }
rafi-lifecycle = { workspace = true }
rafi-live-client = { workspace = true }
rafi-raffle = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
