[package]
name = "rafi-live-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The server side of live updates: the notifier a deployment pushes them through, the participant view of a raffle, when a live channel publishes it, and issuing and verifying the ALTCHA proof-of-work"
publish = false

[dependencies]
anyhow = "1"
hex = { workspace = true }
hmac = "0.12"
rafi-engine = { workspace = true }
rafi-lifecycle = { workspace = true }
rafi-live-client = { workspace = true }
rafi-raffle = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt"] }
