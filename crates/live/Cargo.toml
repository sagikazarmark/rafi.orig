[package]
name = "rafi-live"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "What a phone sees live: the participant view, its partyline channel, the participant card and the ALTCHA proof-of-work"
publish = false

[features]
## Issue and verify ALTCHA challenges (HMAC). The phone only solves.
server = ["dep:hmac"]

[dependencies]
base64 = "0.22"
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals"] }
hex.workspace = true
hmac = { version = "0.12", optional = true }
partyline = "0.3"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
dioxus-ssr = "=0.7.10"
