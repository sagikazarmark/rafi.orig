[package]
name = "rafi-live"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "What a phone sees live: the participant view, its partyline channel, the participant card and the ALTCHA proof-of-work"
publish = false

[features]
## The phone's card as a Dioxus component (`Card`), for the server's SSR and
## the WASM. Off, nothing here depends on Dioxus.
card = ["dep:dioxus"]
## Issue and verify ALTCHA challenges (HMAC). The phone only solves.
server = ["dep:hmac"]
## Build participant views from a raffle as drawn (`raffle::view`):
## for servers. Pulls in rafi-raffle (drand, BLS), so the phone leaves it off.
raffle = ["dep:rafi-lifecycle", "dep:rafi-raffle"]

[dependencies]
base64 = "0.22"
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals"], optional = true }
hex.workspace = true
hmac = { version = "0.12", optional = true }
partyline = "0.3"
rafi-raffle = { workspace = true, optional = true }
rafi-lifecycle = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
dioxus-ssr = "=0.7.10"
# Itself with `raffle`, so its tests run with the workspace's.
rafi-live = { path = ".", features = ["raffle", "card"] }
rafi-raffle.workspace = true
