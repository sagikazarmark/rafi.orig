[package]
name = "rafi-cloudflare-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rafi's app on Cloudflare Workers: rafi-server's routes behind Clerk, phones' live channels, the housekeeping run and the RaffleRoom Durable Object, for the app Worker and the local combined one"
publish = false

[features]
## Local development only: allows RAFI_DEV_AUTH and the mock drand chain
## (RAFI_DRAND_MOCK).
dev = ["rafi-server/mock-drand"]

# Everything here is Workers glue: the crate is empty on other targets.
[target.'cfg(target_arch = "wasm32")'.dependencies]
anyhow = { workspace = true }
axum = { version = "0.8", default-features = false }
dioxus-clerk = { version = "0.8", features = ["server", "worker"] }
http = "1"
http-body-util = "0.1"
rafi-app = { workspace = true }
# `room`: the RaffleRoom class, which the app's Worker hosts.
rafi-cloudflare = { workspace = true, features = ["room", "log"] }
rafi-engine = { workspace = true }
rafi-live-server = { workspace = true }
rafi-server = { workspace = true }
tower-service = "0.3"
worker = { workspace = true, features = ["http", "axum"] }
