[package]
name = "rafi-live-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "What a phone sees live and runs: the participant view, its partyline channel and the participant card"
publish = false

[features]
## The phone's card as a Dioxus component (`Card`), for the server's SSR and
## the WASM. Off, nothing here depends on Dioxus.
card = ["dep:dioxus"]

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals"], optional = true }
partyline = "0.3"
serde = { workspace = true }

[dev-dependencies]
dioxus-ssr = "=0.7.10"
serde_json = { workspace = true }
# Itself with `card`, so its tests run with the workspace's.
rafi-live-client = { path = ".", features = ["card"] }
