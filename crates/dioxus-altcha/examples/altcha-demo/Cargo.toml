[package]
name = "altcha-demo"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "dioxus-altcha in a browser: issue, solve and verify, all in the page (`dx serve`); `?bench` measures (plan M4)"
publish = false

# Its own workspace: a dx web app, kept out of the native workspace builds.
[workspace]

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
dioxus-altcha = { path = "../.." }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Location", "Window"] }

# verify_solution reads std clocks, which panic in the browser without this
# (altcha-org/altcha-lib-rs#1). Drop it once released.
[patch.crates-io]
altcha = { git = "https://github.com/sagikazarmark/altcha-lib-rs", rev = "d2f9476826fe0965d687bed142e920ca2b91430a" }
