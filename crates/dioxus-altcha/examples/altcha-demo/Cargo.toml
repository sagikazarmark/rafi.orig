[package]
name = "altcha-demo"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "dioxus-altcha end to end: a Dioxus fullstack app that issues, solves and verifies (`dx serve`); /bench measures (plan M4)"
publish = false

# Its own workspace: a dx fullstack app, kept out of the native workspace builds.
[workspace]

[features]
default = []
web = ["dioxus/web", "dep:js-sys", "dep:web-sys", "dep:wasm-bindgen-futures"]
server = ["dioxus/server", "dep:getrandom"]

[dependencies]
dioxus = { version = "0.7", features = ["fullstack", "router"] }
dioxus-altcha = { path = "../.." }
serde = { version = "1", features = ["derive"] }

# The browser's side.
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["Location", "Window"], optional = true }

# The server's side: its HMAC key when ALTCHA_DEMO_KEY is unset.
getrandom = { version = "0.2", optional = true }

# The bench (/bench) solves and verifies with altcha's Rust in the browser,
# which reads std clocks there without this (altcha-org/altcha-lib-rs#1).
# Drop it once released.
[patch.crates-io]
altcha = { git = "https://github.com/sagikazarmark/altcha-lib-rs", rev = "d2f9476826fe0965d687bed142e920ca2b91430a" }
