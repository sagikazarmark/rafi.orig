[package]
name = "rafi-channel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rafi's live channel: the participant view built from the database, and the per-raffle Durable Object that pushes it to phones"
publish = false

[dependencies]
rafi-core.workspace = true
rafi-live = { path = "../live" }
rafi-store.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
partyline-worker = "0.2"
wasm-bindgen = "0.2"
worker = "0.8.7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
