[package]
name = "rafi-channel-check"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Drives rafi-channel's Durable Object end to end under `wrangler dev` (see scenario.mjs)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
rafi-channel = { path = "../channel" }
rafi-core.workspace = true
rafi-drand = { path = "../drand", features = ["mock"] }
rafi-store.workspace = true
serde_json.workspace = true
worker = "0.8.7"
