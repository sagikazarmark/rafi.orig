[package]
name = "rafi-raffle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rafi's raffle: a verifiable raffle of items among entrants (the state machine, the draw algorithm, the manifest and the verifier)"
publish = false

[features]
## `mock-chain`: the mock drand chain, a test chain with a public seed
## (development and tests only; raffles on it are not publicly verifiable).
mock-chain = ["drand/test-chain"]

[dependencies]
drand = { workspace = true, features = ["bls12-381"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
drand = { workspace = true, features = ["test-chain"] }
rafi-raffle = { path = ".", features = ["mock-chain"] }
proptest = "1"
