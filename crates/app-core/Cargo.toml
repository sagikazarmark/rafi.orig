[package]
name = "rafi-app-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "What the Rafi app does, without HTTP: the organizer's and the participants' use cases over the store, the raffle engine and the live notifier, and the join's rate limits"
publish = false

[dependencies]
anyhow = "1"
altcha = { workspace = true }
base64 = "0.23"
getrandom = { version = "0.3", features = ["wasm_js"] }
hex = { workspace = true }
rafi-raffle = { workspace = true }
rafi-engine = { workspace = true }
rafi-live-client = { workspace = true }
rafi-live-server = { workspace = true }
rafi-api = { workspace = true }
rafi-lifecycle = { workspace = true }
rafi-store = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `altcha`'s rand 0.8 needs getrandom 0.2's JS backend on wasm32.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]
rafi-lifecycle = { workspace = true }
rafi-engine = { workspace = true, features = ["local", "mock-drand"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
