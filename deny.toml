[graph]
all-features = true

[licenses]
# The workspace's own crates are AGPL-3.0-only and never published; the
# allowlist below is a policy for third-party code only.
private = { ignore = true }
allow = [
  "Apache-2.0",
  "MIT",

  "Unicode-3.0",
  "BSD-3-Clause",
  "ISC",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "Zlib",
  "BSL-1.0",
  "BSD-2-Clause",
  # PostgreSQL itself: the embedded Postgres in rafi-store's tests (Oliphaunt).
  "PostgreSQL",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# dioxus-primitives (pinned rev), required by the dioxus-daisyui-components registry.
allow-git = [
  "https://github.com/DioxusLabs/components",
  # restate-sdk made safe on wasm32 (Cloudflare Workers); upstream PR open.
  # Remove with the [patch.crates-io] entry once it's released.
  "https://github.com/sagikazarmark/restate-sdk-rust",
]
