name: Deploy to Cloudflare

# Deploys a release of Rafi to an installation's Cloudflare account, called
# from the installation's own repository (a copy of deploy/cloudflare, whose
# .github/workflows/deploy.yml calls this file at the release's tag): the app
# Worker and the release's own raffle engine Worker, registered with Restate.
#
# It downloads the release's one asset, worker.tar.gz, from this repository's
# GitHub release v<version>; refuses it unless its build provenance
# attestation says this repository's release workflow (release.yaml) built it
# from the tag v<version> on GitHub's runners; unpacks it into release/ in the
# caller's checkout; and runs release/deploy.sh, the release's own deploy
# (scripts/cloudflare-deploy.sh here; its header says what it does: the
# checks, legal/ copied in, "is anything live?", the D1 migrations, the
# engine Worker deployed and registered, the app Worker, the drained engine
# Workers pruned). wrangler and the Restate CLI come through npx at the
# versions deploy.sh pins; nothing else is installed.
#
# Inputs:
#   version             the release, e.g. 0.1.0 (a leading v is dropped)
#   deploy_while_live   deploy even though raffles are live (RAFI_DEPLOY_WHILE_LIVE=1)
#   environment         a GitHub environment of the caller's, for its protection rules
#                       (required reviewers, branches); none when empty
# Secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   the account the Workers and the database are on
#   RESTATE_ADMIN_URL      the Restate Cloud environment's admin API (https://<env>.env.<region>.restate.cloud:9070)
#   RESTATE_AUTH_TOKEN     a Restate Cloud API key with the Admin role
#   RAFI_SECRETS           optional: the app Worker's secrets, a dotenv file's content (.dev.vars.example
#                          lists them), set on every deploy (none removed); without it the Worker's
#                          secrets are the operator's (`wrangler secret bulk`)
#
# One deploy at a time per repository (the concurrency group); a newer run
# waits, it never cancels one in progress.
on:
  workflow_call:
    inputs:
      version:
        description: "The Rafi release to deploy, e.g. 0.1.0"
        required: true
        type: string
      deploy_while_live:
        description: Deploy even though raffles are live
        required: false
        type: boolean
        default: false
      environment:
        description: "A GitHub environment for protection rules (none when empty)"
        required: false
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      RESTATE_ADMIN_URL:
        required: true
      RESTATE_AUTH_TOKEN:
        required: true
      RAFI_SECRETS:
        required: false

permissions:
  contents: read

env:
  # Where releases come from, and whose release workflow attests them: the
  # one place this workflow names the Rafi repository.
  RAFI_REPOSITORY: sagikazarmark/rafi

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Deploy Rafi ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: rafi-deploy
      cancel-in-progress: false
    timeout-minutes: 30
    # Reading the caller's repository; the release and its attestation are
    # public, read with the same token.
    permissions:
      contents: read

    steps:
      - name: Check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version: '$INPUT_VERSION' is not a Rafi release (x.y.z, or x.y.z-pre.release)"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Rafi $version from $RAFI_REPOSITORY"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # deploy.sh and wrangler need Node.js (wrangler 22 or later).
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rm -rf "$RUNNER_TEMP/rafi-release"
          mkdir -p "$RUNNER_TEMP/rafi-release"
          gh release download "v$VERSION" --repo "$RAFI_REPOSITORY" --pattern worker.tar.gz --dir "$RUNNER_TEMP/rafi-release"
          sha256sum "$RUNNER_TEMP/rafi-release/worker.tar.gz"

      # The attestation's certificate names the workflow that signed it and
      # the ref it ran on: release.yaml, at the tag v<version>, in the Rafi
      # repository, on a GitHub-hosted runner. Any other build of these bytes,
      # or bytes nobody attested, stop here.
      - name: Verify its provenance
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh attestation verify "$RUNNER_TEMP/rafi-release/worker.tar.gz" \
            --repo "$RAFI_REPOSITORY" \
            --signer-workflow "github.com/$RAFI_REPOSITORY/.github/workflows/release.yaml" \
            --source-ref "refs/tags/v$VERSION" \
            --deny-self-hosted-runners

      - name: Unpack it into release/
        run: |
          rm -rf release
          mkdir release
          tar -xzf "$RUNNER_TEMP/rafi-release/worker.tar.gz" -C release
          echo "release/: Rafi $(cat release/VERSION)"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESTATE_ADMIN_URL: ${{ secrets.RESTATE_ADMIN_URL }}
          RESTATE_AUTH_TOKEN: ${{ secrets.RESTATE_AUTH_TOKEN }}
          RAFI_SECRETS: ${{ secrets.RAFI_SECRETS }}
          RAFI_VERSION: ${{ steps.version.outputs.version }}
          DEPLOY_WHILE_LIVE: ${{ inputs.deploy_while_live }}
        run: |
          # The app Worker's secrets, if given: a file only this user reads,
          # gone when the step ends; wrangler deploy --secrets-file sets them.
          if [ -n "$RAFI_SECRETS" ]; then
            export RAFI_SECRETS_FILE="$RUNNER_TEMP/rafi-secrets.env"
            trap 'rm -f "$RAFI_SECRETS_FILE"' EXIT
            (umask 077 && printf '%s\n' "$RAFI_SECRETS" >"$RAFI_SECRETS_FILE")
            chmod 600 "$RAFI_SECRETS_FILE"
          fi
          unset RAFI_SECRETS
          if [ "$DEPLOY_WHILE_LIVE" = true ]; then export RAFI_DEPLOY_WHILE_LIVE=1; fi
          release/deploy.sh
