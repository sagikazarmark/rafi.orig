name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # Every step runs in the devenv shell, with the project's toolchain and
    # tools at the versions used locally (wasm-bindgen at Cargo.lock's, dx,
    # worker-build, wasm-opt, wrangler, node, tailwindcss, restate-server).
    shell: devenv shell -- bash -e {0}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # The store's conformance suite and the app's tests also run against Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rafi
          POSTGRES_PASSWORD: rafi
          POSTGRES_DB: rafi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rafi -d rafi_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      RAFI_TEST_POSTGRES_URL: postgres://rafi:rafi@localhost:5432/rafi_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@f2d55def32daee3f89bb3dfa0499b439a988392a # v0.2.0
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}
      # rafi-web's asset!() needs the stylesheet to exist. Entering the shell
      # installs apps/web's npm packages (daisyUI).
      - name: Build the stylesheet (Tailwind CSS + daisyUI)
        working-directory: apps/web
        run: tailwindcss -i tailwind.css -o assets/tailwind.css --minify
      - name: Format
        run: cargo fmt --all --check
      # The end-to-end tests run the shell's restate-server (RESTATE_SERVER_BIN, from devenv.nix).
      - name: Libraries and the draw engine (incl. end-to-end against restate-server)
        run: cargo test --workspace --exclude rafi-server --exclude rafi-web --locked -- --include-ignored
      - name: Independent verifier agrees with the test vectors
        run: python3 tools/verify.py --vectors testdata/draw-vectors.json
      - name: App (incl. end-to-end with the Restate engine and restate-server)
        run: cargo test -p rafi-server --locked -- --include-ignored
      - name: Clippy (libraries and the draw engine)
        run: cargo clippy --workspace --exclude rafi-server --exclude rafi --exclude rafi-web --all-targets -- -D warnings
      - name: Clippy (app server)
        run: |
          cargo clippy -p rafi-server --all-targets -- -D warnings
          cargo clippy -p rafi-server --features mock-drand --all-targets -- -D warnings
          cargo clippy -p rafi --all-targets -- -D warnings
          cargo clippy -p rafi --features dev,mock-drand --all-targets -- -D warnings
      - name: Clippy (app web)
        run: cargo clippy -p rafi-web --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy (Workers crates)
        run: |
          cargo clippy --target wasm32-unknown-unknown \
            -p rafi-lifecycle -p rafi-raffle -p rafi-api -p rafi-app \
            -p rafi-store -p rafi-store-d1-check -p rafi-live-client -p rafi-live-server -p rafi-cloudflare -p rafi-cloudflare-check \
            -p rafi-engine -p rafi-engine-restate -p rafi-participant -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p rafi-server --lib -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p rafi-worker -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p rafi-worker --features dev -- -D warnings

  workers:
    name: Workers (wrangler dev)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@f2d55def32daee3f89bb3dfa0499b439a988392a # v0.2.0
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}
      # Chrome and the browser drivers are the runner image's.
      - name: D1, the live channel, the participant page in Chrome, a draw through Restate, an evening on the app
        run: CHROMIUM=$(command -v google-chrome) ./scripts/workers-check.sh

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
