name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # The store's conformance suite and the app's tests also run against Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rafi
          POSTGRES_PASSWORD: rafi
          POSTGRES_DB: rafi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rafi -d rafi_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      RAFI_TEST_POSTGRES_URL: postgres://rafi:rafi@localhost:5432/rafi_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build the stylesheet (Tailwind CSS + daisyUI)
        run: ./scripts/tailwind.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Download restate-server (end-to-end tests)
        run: echo "RESTATE_SERVER_BIN=$(./scripts/restate-server.sh)" >> "$GITHUB_ENV"
      - name: Libraries and the draw engine (incl. end-to-end against restate-server)
        run: cargo test --workspace --exclude rafi --locked -- --include-ignored
      - name: Independent verifier agrees with the test vectors
        run: python3 tools/verify.py --vectors testdata/draw-vectors.json
      - name: App (incl. end-to-end with the Restate engine and restate-server)
        run: cargo test -p rafi --features server --locked -- --include-ignored
      - name: Clippy (libraries and the draw engine)
        run: cargo clippy --workspace --exclude rafi --all-targets -- -D warnings
      - name: Clippy (app server)
        run: |
          cargo clippy -p rafi --features server --all-targets -- -D warnings
          cargo clippy -p rafi --features server,mock-drand --all-targets -- -D warnings
      - name: Clippy (app web)
        run: cargo clippy -p rafi --features web --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy (Workers crates)
        run: |
          cargo clippy --target wasm32-unknown-unknown \
            -p rafi-raffle -p rafi-drawing -p rafi-drand -p rafi-model -p rafi-app-core \
            -p rafi-store -p rafi-store-d1-check -p rafi-live -p rafi-platform -p rafi-cloudflare -p rafi-cloudflare-check \
            -p rafi-engine -p rafi-engine-restate -p rafi-participant -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p rafi-restate-worker --features dev -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p rafi-restate-worker -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p rafi --features worker -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p rafi --features worker-dev -- -D warnings

  workers:
    name: Workers (wrangler dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: Tools (wasm-bindgen at the lockfile's version, worker-build, wasm-opt, wrangler)
        run: |
          WASM_BINDGEN=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          cargo binstall -y --locked "wasm-bindgen-cli@$WASM_BINDGEN" worker-build dioxus-cli@0.7.10
          sudo apt-get update && sudo apt-get install -y binaryen
          npm install -g wrangler@4.94.0
      - name: Download restate-server
        run: echo "RESTATE_SERVER_BIN=$(./scripts/restate-server.sh)" >> "$GITHUB_ENV"
      - name: D1, the live channel, the participant page in Chrome, a draw through Restate, an evening on the app
        run: CHROMIUM=$(command -v google-chrome) ./scripts/workers-check.sh


  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  image:
    name: Image (${{ matrix.name }})
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: rafi
            dockerfile: Dockerfile
            platforms: linux/amd64
          - name: restate-rafi
            dockerfile: crates/restate-rafi-endpoint/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          build-args: |
            CLERK_PUBLISHABLE_KEY=${{ vars.CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
