name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build the stylesheet (Tailwind CSS + daisyUI)
        run: ./scripts/tailwind.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Download restate-server (end-to-end tests)
        run: echo "RESTATE_SERVER_BIN=$(./scripts/restate-server.sh)" >> "$GITHUB_ENV"
      - name: Libraries and the draw engine (incl. end-to-end against restate-server)
        run: cargo test --workspace --exclude rafi --locked -- --include-ignored
      - name: Independent verifier agrees with the test vectors
        run: python3 tools/verify.py --vectors testdata/draw-vectors.json
      - name: App (incl. end-to-end with restate-rafi and restate-server)
        run: cargo test -p rafi --features server --locked -- --include-ignored
      - name: Clippy (libraries and the draw engine)
        run: cargo clippy --workspace --exclude rafi --all-targets -- -D warnings
      - name: Clippy (app server)
        run: cargo clippy -p rafi --features server --all-targets -- -D warnings
      - name: Clippy (app web)
        run: cargo clippy -p rafi --features web --target wasm32-unknown-unknown -- -D warnings

  drand-beacon:
    name: drand-beacon (wasm, no_std, features, MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Verifier core on wasm32 (no default features + bls12-381)
        run: cargo build -p drand-beacon --target wasm32-unknown-unknown --no-default-features --features bls12-381 --locked
      - name: The client is compiled out on wasm32
        run: cargo build -p drand-beacon --target wasm32-unknown-unknown --features client,rustls,test-chain --locked
      - name: No std or getrandom in the wasm core
        run: |
          tree=$(cargo tree -p drand-beacon -e features,normal --target wasm32-unknown-unknown --no-default-features -F bls12-381)
          if grep -E 'feature "std"|getrandom' <<<"$tree"; then echo "std leaked into the core"; exit 1; fi
      - name: Tests without TLS (the client must refuse to build without a backend)
        run: cargo test -p drand-beacon --features client,test-chain --locked
      - name: Clippy (all features)
        run: cargo clippy -p drand-beacon --all-targets --all-features -- -D warnings
      - name: Docs
        run: RUSTDOCFLAGS=-Dwarnings cargo doc -p drand-beacon --no-deps --all-features
      - uses: dtolnay/rust-toolchain@1.85
      - name: MSRV, extracted from the workspace (as it will be published)
        run: |
          cp -R crates/drand-beacon "$RUNNER_TEMP/drand-beacon"
          cd "$RUNNER_TEMP/drand-beacon"
          cargo +1.85 generate-lockfile
          cargo +1.85 test --features client,test-chain

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  image:
    name: Image (${{ matrix.name }})
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: rafi
            dockerfile: Dockerfile
            platforms: linux/amd64
          - name: restate-rafi
            dockerfile: crates/restate-rafi-endpoint/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          build-args: |
            CLERK_PUBLISHABLE_KEY=${{ vars.CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
