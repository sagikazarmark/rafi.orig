name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # Every step runs in the devenv shell, with the project's toolchain and
    # tools at the versions used locally (wasm-bindgen at Cargo.lock's, dx,
    # worker-build, wasm-opt, wrangler, node, tailwindcss, restate-server).
    # Each job runs one recipe of the justfile, so CI and `just ci` agree.
    shell: devenv shell -- bash -e {0}

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
      - name: Check formatting
        run: just fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}
      - name: Clippy (libraries, the engine and the app)
        run: just clippy-native

  clippy-wasm:
    name: Clippy (wasm32)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}
      # Entering the shell installs apps/web's npm packages (daisyUI), which
      # the stylesheet the recipe builds first needs.
      - name: Clippy (the web app, the Workers crates and the Worker)
        run: just clippy-wasm

  test:
    name: Test
    runs-on: ubuntu-latest
    # The store's conformance suite and the app's tests also run against Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rafi
          POSTGRES_PASSWORD: rafi
          POSTGRES_DB: rafi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rafi -d rafi_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      RAFI_TEST_POSTGRES_URL: postgres://rafi:rafi@localhost:5432/rafi_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}
      # The end-to-end tests run the shell's restate-server (RESTATE_SERVER_BIN, from devenv.nix).
      - name: Test (incl. end to end against restate-server)
        run: just test
      - name: Independent verifier agrees with the test vectors
        run: just verify

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}
      - name: Doc
        run: just doc

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
      - name: Check dependencies
        run: just deny

  workers:
    name: Workers (wrangler dev)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: devenv shell -- {0}
      # Chrome and the browser drivers are the runner image's.
      - name: D1, the live channel, the participant page in Chrome, a draw through Restate, an evening on the app
        run: CHROMIUM=$(command -v google-chrome) just workers
