name: Release

# A tag vX.Y.Z builds the Cloudflare tarball of X.Y.Z (artifact.yaml:
# worker.tar.gz, the app, engine and live Workers, the D1 migrations and
# deploy.sh), then publishes it with worker.tar.gz as its one asset and notes
# generated from the merged pull requests. It checks nothing: CI checked the
# commit (ci.yaml's cloudflare job) before it was tagged.
#
# The tarball has a build provenance attestation, made here, not in
# artifact.yaml: it is signed as this workflow at the tag
# (.github/workflows/release.yaml@refs/tags/vX.Y.Z), which installations'
# workflows (the deploy template's deploy.yaml and restate-cleanup.yaml)
# require of it (`gh attestation verify worker.tar.gz -R <repository>`).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  artifact:
    name: Artifact
    uses: ./.github/workflows/artifact.yaml
    with:
      version: ${{ github.ref_name }}

  release:
    name: Release
    needs: artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The build provenance attestation.
      id-token: write
      attestations: write

    steps:
      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker.tar.gz

      - name: Attest the tarball's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: worker.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" worker.tar.gz
