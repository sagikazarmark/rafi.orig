name: Release

# A tag v<version> builds the Cloudflare release (scripts/cloudflare-release.sh):
# the artifact, its tarball and checksums, and a dry deploy of that tarball
# through deploy/cloudflare, fetched the way an installation fetches it. The
# release is published with generated notes.
# deploy/cloudflare pins the version it fetches (RAFI_VERSION in deploy.sh),
# and the script refuses a release it doesn't pin, so the template on main
# always names a release that exists. Once published, the tarball's digest as
# GitHub computed it on upload must be the one the build computed: that is
# what an installation pins as RAFI_SHA256, and an upload gone wrong would
# otherwise be found by the first installation to upgrade.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # The devenv shell, with the toolchain at the versions used locally.
    shell: devenv shell -- bash -e {0}

jobs:
  cloudflare:
    name: Cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0

      - name: Build and check the release
        run: just cloudflare-release "${GITHUB_REF_NAME#v}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME" \
            target/cloudflare/rafi-cloudflare-*.tar.gz target/cloudflare/SHA256SUMS

      - name: Check the published tarball against the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="rafi-cloudflare-${GITHUB_REF_NAME#v}.tar.gz"
          built="$(grep " $tarball\$" target/cloudflare/SHA256SUMS | cut -d' ' -f1)"
          published="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq ".assets[] | select(.name == \"$tarball\") | .digest")"
          if [ "$published" != "sha256:$built" ]; then
            echo "GitHub says $tarball is '$published'; the build says sha256:$built" >&2
            exit 1
          fi
          echo "RAFI_VERSION=${GITHUB_REF_NAME#v}"
          echo "RAFI_SHA256=$built"
