name: Release

# A tag v<version> builds the Cloudflare release (scripts/cloudflare-release.sh):
# the artifact as worker.tar.gz, and a dry deploy of it through
# deploy/cloudflare, downloaded and put in place by the template's own
# `npm run build`, as an installation does it.
#
# The release job needs CI (ci.yaml, called here on the tag's commit): a
# commit whose checks fail is never released; the job is skipped, not failed.
# It publishes in three steps: a draft with worker.tar.gz, its one asset; the
# tarball's digest as GitHub computed it on upload (the one the release page
# shows next to the asset) checked against the build's own sha256 (an upload
# gone wrong would otherwise be found by the first installation to upgrade);
# then the draft published. The tarball has a build provenance attestation
# (`gh attestation verify worker.tar.gz -R <repository>`), and is packed
# reproducibly (apps/worker's `just release`: sorted, fixed times and
# owners), so another build of the tag can be compared with it.
#
# A tag with a pre-release suffix (v0.1.0-rc.1) is published as a pre-release.
# The notes are generated from the merged pull requests.
#
# deploy/cloudflare pins the version it downloads (config.rafi_version in its
# package.json), and the script refuses a release it doesn't pin, so the
# template on main always names a release that exists.
#
# Run by hand (workflow_dispatch), it rehearses: CI, the build and the dry
# deploy of the version given (by default the one deploy/cloudflare pins),
# publishing nothing unless `dry_run` is off, which publishes the tag
# v<version> that must already exist (to finish a release whose run failed).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "The version (default: the one deploy/cloudflare pins)"
        required: false
        type: string
      dry_run:
        description: Rehearse only, publishing nothing
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # The devenv shell, with the toolchain at the versions used locally.
    shell: devenv shell -- bash -e {0}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yaml

  cloudflare:
    name: Cloudflare
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The build provenance attestation.
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0

      - name: Which release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version="${INPUT_VERSION#v}"
            [ -n "$version" ] || version="$(node -p "require('./deploy/cloudflare/package.json').config.rafi_version")"
            if [ "$INPUT_DRY_RUN" = false ]; then publish=true; else publish=false; fi
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"
          echo "release $version (publish: $publish, pre-release: $prerelease)"

      - name: Build and check the release
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: just cloudflare-release "$VERSION"

      - name: Attest the tarball's provenance
        if: steps.release.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/cloudflare/worker.tar.gz

      - name: Create the release as a draft
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --draft --generate-notes "${flags[@]}" \
            --title "$TAG" \
            target/cloudflare/worker.tar.gz

      - name: Check the uploaded tarball against the build
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          built="$(sha256sum target/cloudflare/worker.tar.gz | cut -d' ' -f1)"
          # A draft isn't found by its tag; the list has it.
          uploaded="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .assets[] | select(.name == \"worker.tar.gz\") | .digest")"
          if [ "$uploaded" != "sha256:$built" ]; then
            echo "GitHub says worker.tar.gz is '$uploaded'; the build says sha256:$built. The draft stays a draft." >&2
            exit 1
          fi
          echo "worker.tar.gz: sha256:$built"

      - name: Publish the release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
