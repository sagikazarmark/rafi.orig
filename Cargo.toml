[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "testbeds/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/rafi"
rust-version = "1.92"

[workspace.dependencies]
dioxus-altcha = { version = "0.1", default-features = false }
altcha = "1"
altcha-server = "0.1"
rafi-lifecycle = { path = "crates/lifecycle" }
rafi-raffle = { path = "crates/raffle" }
rafi-api = { path = "crates/api" }
rafi-store = { path = "crates/store" }
rafi-engine = { path = "crates/engine" }
rafi-engine-restate = { path = "crates/engine-restate" }
rafi-live-client = { path = "crates/live-client" }
rafi-live-server = { path = "crates/live-server" }
rafi-cloudflare = { path = "crates/cloudflare" }
rafi-app = { path = "crates/app" }
rafi-server = { path = "crates/server" }
drand = { version = "0.3", default-features = false }
restate-drand = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
restate-sdk = { version = "0.12", default-features = false }

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

# Restate SDK made safe on wasm32-unknown-unknown (Cloudflare Workers): std
# clocks via web-time, no Tokio timer around the input drain, JS getrandom
# backends. Upstream PR open; drop this once it is released.
[patch.crates-io]
restate-sdk = { git = "https://github.com/sagikazarmark/restate-sdk-rust", branch = "wasm" }
# altcha's solve_challenge and verify_solution read std clocks, which panic on
# wasm32-unknown-unknown; this uses web-time (altcha-org/altcha-lib-rs#1).
# rafi-worker verifies on Workers (through altcha-server, whose `altcha` this
# patches too). Drop this once it is released.
altcha = { git = "https://github.com/sagikazarmark/altcha-lib-rs", rev = "d2f9476826fe0965d687bed142e920ca2b91430a" }
