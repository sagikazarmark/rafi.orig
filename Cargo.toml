[workspace]
resolver = "3"
members = ["crates/core", "crates/drand", "crates/drand-beacon", "crates/restate-drand", "crates/store", "crates/restate-rafi", "crates/restate-rafi-endpoint", "crates/app"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/rafi"
rust-version = "1.92"

[workspace.dependencies]
rafi-core = { path = "crates/core" }
rafi-drand = { path = "crates/drand" }
drand-beacon = { path = "crates/drand-beacon", default-features = false }
rafi-store = { path = "crates/store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
restate-sdk = { version = "0.12", default-features = false }

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
