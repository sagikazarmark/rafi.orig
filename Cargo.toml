[workspace]
resolver = "3"
members = ["crates/lifecycle", "crates/drawing", "crates/drand", "crates/store", "crates/engine-restate", "crates/engine", "crates/restate-rafi-endpoint", "crates/app", "crates/live", "crates/store-d1-check", "crates/platform", "crates/cloudflare", "crates/cloudflare-check", "crates/restate-worker", "crates/participant", "crates/model", "crates/app-core"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/rafi"
rust-version = "1.92"

[workspace.dependencies]
rafi-lifecycle = { path = "crates/lifecycle" }
rafi-drawing = { path = "crates/drawing" }
rafi-drand = { path = "crates/drand" }
drand = { version = "0.3", default-features = false }
restate-drand = { version = "0.3", default-features = false }
rafi-store = { path = "crates/store" }
rafi-model = { path = "crates/model" }
rafi-app-core = { path = "crates/app-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
restate-sdk = { version = "0.12", default-features = false }

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

# Restate SDK made safe on wasm32-unknown-unknown (Cloudflare Workers): std
# clocks via web-time, no Tokio timer around the input drain, JS getrandom
# backends. Upstream PR open; drop this once it is released.
[patch.crates-io]
restate-sdk = { git = "https://github.com/sagikazarmark/restate-sdk-rust", branch = "wasm" }
