# Rafi on Cloudflare Workers: one installation's configuration of the app
# Worker (the web app and its API, the live channels, the housekeeping Cron).
# The raffle engine is a second Worker (engine.wrangler.toml), one per
# release. This is the app Worker's shape as the Rafi repository ships it
# (apps/worker-app/wrangler.toml), pointed at a release's files in release/
# (the release unpacked there, its deploy.sh copying legal/ in), with your
# database and domain in place of the placeholders. Everything else of yours
# is a secret or a file in legal/. `release/deploy.sh` (which
# .github/workflows/deploy.yml runs on every push) checks this file against
# engine.wrangler.toml and the release, applies the D1 migrations and
# deploys both Workers; write the keys it reads (name, main, directory,
# binding, database_id, migrations_dir, class_name, RAFI_DO_JURISDICTION) as
# `key = "value"` on one line, as they are here.
#
# Reference: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "rafi"
main = "release/app/build/index.js"
compatibility_date = "2026-10-01"
# Only your domain: no *.workers.dev address, no preview URLs (a preview would
# share production's database and objects). Your domain, which each deploy
# attaches as the Worker's custom domain: the origin RAFI_PUBLIC_URL names and
# Clerk allows.
workers_dev = false
preview_urls = false
# routes = [{ pattern = "raffle.example.org", custom_domain = true }]

# The web app's files, the participant scripts and your legal documents
# (legal/, copied in by deploy.sh). A path that isn't a file goes to the
# Worker, which serves the web app's page itself (with a
# Content-Security-Policy naming your Clerk host); the raffle engine's paths
# (/restate/) answer 404 here. The binding is how the Worker reads the legal
# documents.
[assets]
directory = "release/app/assets"
binding = "ASSETS"

# Your database: `wrangler d1 create rafi --jurisdiction eu`, and paste the ID
# here and in engine.wrangler.toml (the engine writes draws to it). The
# migrations run before each deploy (deploy.sh).
[[d1_databases]]
binding = "DB"
database_name = "rafi"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "release/migrations/sqlite"

# One live channel per raffle, in the jurisdiction RAFI_DO_JURISDICTION names.
# The class is this Worker's; the engine binds it by this Worker's name.
[[durable_objects.bindings]]
name = "RAFFLE_ROOM"
class_name = "RaffleRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaffleRoom"]

# Soft limits on joining and on the organizer's adds (approximate, per
# location). Keys are never IP addresses: a venue shares one. The hard limit
# is the entrant cap (RAFI_MAX_ENTRANTS).
[[ratelimits]]
name = "JOIN_PER_RAFFLE_LIMITER"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "JOIN_PER_EMAIL_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "CONNECT_LIMITER"
namespace_id = "1003"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "ADD_LIMITER"
namespace_id = "1004"
simple = { limit = 20, period = 60 }

# Housekeeping, hourly: erasing personal data as raffles age, expired
# proof-of-work challenges, stale live channels.
[triggers]
crons = ["0 * * * *"]

# The application's own log lines (warnings and errors, raffle IDs and error
# text, never personal data; the hourly housekeeping report) are kept in
# Workers Logs. The automatic per-invocation records are not: they would
# hold client IPs and cookies.
[observability]
enabled = true

[observability.logs]
invocation_logs = false

# Where the live channels' Durable Objects live: "eu", "fedramp", or "none".
# engine.wrangler.toml says the same.
[vars]
RAFI_DO_JURISDICTION = "eu"

# What this installation sets, as secrets (.dev.vars.example): in the
# RAFI_SECRETS GitHub secret, which every deploy sets, or once with
# `wrangler secret bulk .dev.vars` before the first deploy (then `wrangler
# secret put <NAME>`):
#   RAFI_PUBLIC_URL                        the public origin, no trailing slash
#   RAFI_ENGINE_INGRESS_URL                Restate Cloud's ingress URL (EU)
#   RAFI_ENGINE_API_KEY                    a Restate Cloud API key with ingress access
#   RAFI_POW_KEY                           random, 32+ characters; never rotate during an event
#   CLERK_SECRET_KEY
#   CLERK_PUBLISHABLE_KEY                  not secret (the web app gets it from /config.js), but yours
#   RAFI_OPERATOR_NAME, RAFI_OPERATOR_EMAIL   named as the processor in every raffle's notice
#   RAFI_TERMS_VERSION, RAFI_PRIVACY_VERSION  the documents' versions, e.g. "2026-10"
# wrangler refuses to deploy this Worker while one is missing. The Restate
# environment's identity keys are the engine's (engine.wrangler.toml), not
# this Worker's.
# Optional settings with defaults (RAFI_RETENTION_DAYS, RAFI_RETENTION_MAX_DAYS,
# RAFI_RETENTION_WINNERS_DAYS, RAFI_MIN_AGE, RAFI_DRAND_RELAYS,
# RAFI_DRAND_LEAD_SECS, RAFI_DRAND_TIMEOUT_SECS) are secrets too when you
# change them: https://github.com/sagikazarmark/rafi/blob/main/docs/reference/configuration.md
[secrets]
required = [
  "RAFI_PUBLIC_URL",
  "RAFI_ENGINE_INGRESS_URL",
  "RAFI_ENGINE_API_KEY",
  "RAFI_POW_KEY",
  "CLERK_SECRET_KEY",
  "CLERK_PUBLISHABLE_KEY",
  "RAFI_OPERATOR_NAME",
  "RAFI_OPERATOR_EMAIL",
  "RAFI_TERMS_VERSION",
  "RAFI_PRIVACY_VERSION",
]
