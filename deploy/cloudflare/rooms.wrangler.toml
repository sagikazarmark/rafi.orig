# Rafi on Cloudflare Workers: one installation's configuration of the rooms
# Worker, the raffles' live channels: one RaffleRoom Durable Object per
# raffle, which pushes what phones see. The class is this Worker's, with its
# Durable Object migrations; the app Worker (wrangler.toml) and the engine
# Worker (engine.wrangler.toml) bind it by this Worker's name (their
# script_name). This is the rooms Worker's shape as the Rafi repository ships
# it (apps/worker-rooms/wrangler.toml), pointed at a release's files in
# release/.
#
# It has no address (no route, no workers.dev, no preview URLs) and no
# secrets: it is reached only through the other two Workers' bindings. Every
# deploy deploys it first (deploy.sh), so its class is there before the
# Workers binding it. deploy.sh reads name, main, workers_dev, preview_urls,
# binding, database_id, class_name and RAFI_DO_JURISDICTION; write them as
# `key = "value"` on one line, as they are here.
#
# Reference: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "rafi-rooms"
main = "release/rooms/build/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

# Your database, the app's (wrangler.toml): the same database_id. Each live
# channel reads its raffle from it.
[[d1_databases]]
binding = "DB"
database_name = "rafi"
database_id = "00000000-0000-0000-0000-000000000000"

# One live channel per raffle. The class is this Worker's.
[[durable_objects.bindings]]
name = "RAFFLE_ROOM"
class_name = "RaffleRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaffleRoom"]

# The live channels' application log lines are kept in Workers Logs; the
# automatic per-invocation records are not.
[observability]
enabled = true

[observability.logs]
invocation_logs = false

# Where the live channels' Durable Objects live: "eu", "fedramp", or "none".
# wrangler.toml and engine.wrangler.toml say the same.
[vars]
RAFI_DO_JURISDICTION = "eu"
