name: Restate cleanup

# Removes the engine deployments of earlier releases from Restate once it has
# drained them, and deletes their Workers. Shares deploy.yaml's settings and
# concurrency group. See INSTALL.md and
# https://github.com/sagikazarmark/rafi/blob/main/docs/operations/cloudflare.md

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rafi
  cancel-in-progress: false

env:
  # Where releases come from, and whose release workflow attests them.
  RAFI_REPOSITORY: sagikazarmark/rafi
  # The Wrangler environment to clean up (empty: the configurations' top level).
  CLOUDFLARE_ENV: ""

defaults:
  run:
    shell: bash

jobs:
  cleanup:
    name: Remove drained engine deployments
    runs-on: ubuntu-latest
    # environment: production
    timeout-minutes: 20
    env:
      RAFI_ARTIFACTS_DIR: ${{ github.workspace }}/rafi-artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Read version file
        id: version
        run: |
          file=VERSION
          if [ -n "$CLOUDFLARE_ENV" ] && [ -f "VERSION.$CLOUDFLARE_ENV" ]; then
            file="VERSION.$CLOUDFLARE_ENV"
          fi
          version="$(tr -d '[:space:]' <"$file")"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=$file::$file says '$version', not a Rafi release (x.y.z, or x.y.z-pre.release)"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Rafi $version ($file) from $RAFI_REPOSITORY"

      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release download "v$VERSION" -R "$RAFI_REPOSITORY" -p worker.tar.gz -D "$RUNNER_TEMP"
          sha256sum "$RUNNER_TEMP/worker.tar.gz"

      # Only release.yaml, at the tag, on a GitHub-hosted runner, built it.
      - name: Verify release provenance
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh attestation verify "$RUNNER_TEMP/worker.tar.gz" \
            -R "$RAFI_REPOSITORY" \
            --signer-workflow "github.com/$RAFI_REPOSITORY/.github/workflows/release.yaml" \
            --source-ref "refs/tags/v$VERSION" \
            --deny-self-hosted-runners

      - name: Unpack release
        run: |
          mkdir release
          tar -xzf "$RUNNER_TEMP/worker.tar.gz" -C release

      - name: Remove drained engine deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESTATE_ADMIN_URL: ${{ secrets.RESTATE_ADMIN_URL }}
          RESTATE_AUTH_TOKEN: ${{ secrets.RESTATE_AUTH_TOKEN }}
        run: RAFI_REPORT_FILE="$GITHUB_STEP_SUMMARY" release/deploy.sh cleanup

      - name: Upload deploy.sh JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cleanup-json-${{ github.run_attempt }}
          path: ${{ env.RAFI_ARTIFACTS_DIR }}
          if-no-files-found: ignore
          retention-days: 14
