name: Deploy

# Deploys Rafi to your Cloudflare account on every push to main, and when run
# by hand (Actions > Deploy > Run workflow). The work is the Rafi repository's
# reusable workflow at the release's tag: it downloads the release, checks
# that Rafi's release workflow built it from that tag, and runs the
# release's deploy.sh with your wrangler.toml, engine.wrangler.toml and
# legal/ (deploy/cloudflare's README says what a deploy does).
#
# The release is named twice below, in `uses: ...@v<version>` (the workflow)
# and `version:` (the release it deploys): upgrading is changing both, to the
# same version, and pushing. Never to an older one.
#
# Pushes that change only Markdown outside legal/ (this README, notes) don't
# deploy: a deploy restarts the live channels and stops while a raffle is
# live, which a typo fix shouldn't do. Your legal documents do deploy.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "legal/**"
  workflow_dispatch:
    inputs:
      deploy_while_live:
        description: Deploy even though raffles are live (it drops every phone's live connection)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    uses: sagikazarmark/rafi/.github/workflows/deploy-cloudflare.yml@v0.1.0
    with:
      version: "0.1.0"
      deploy_while_live: ${{ inputs.deploy_while_live == true }}
      # A GitHub environment (Settings > Environments) to require an approval
      # before each deploy, or to hold the secrets below:
      # environment: production
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESTATE_ADMIN_URL: ${{ secrets.RESTATE_ADMIN_URL }}
      RESTATE_AUTH_TOKEN: ${{ secrets.RESTATE_AUTH_TOKEN }}
      # Optional: the app Worker's secrets as a .dev.vars file's content. Without
      # it, set them with `wrangler secret bulk .dev.vars` instead.
      RAFI_SECRETS: ${{ secrets.RAFI_SECRETS }}
