# Rafi on Cloudflare Workers: one installation's configuration of the live
# Worker, the raffles' live channels: one RaffleRoom Durable Object per
# raffle, which pushes what phones see. The class is this Worker's, with its
# Durable Object migrations; the app Worker (wrangler.app.toml) and the
# engine Worker (wrangler.engine.toml) bind it by this Worker's name (their
# script_name). This is the live Worker's shape as the Rafi repository ships
# it (apps/worker-live/wrangler.toml), pointed at a release's files in
# release/.
#
# It has no address (no route, no workers.dev, no preview URLs) and no
# secrets: it is reached only through the other two Workers' bindings. A
# deploy deploys it first (deploy.sh), so its class is there before the
# Workers binding it, and only when its code or this file changed (any edit,
# a comment or another environment's section too): deploying it drops every
# phone's live connection. In a Wrangler environment ([env.<name>], see
# wrangler.app.toml), repeat the vars and the bindings; the migrations are
# inherited.
#
# Reference: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "rafi-live"
main = "release/live/build/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

# Your database, the app's (wrangler.app.toml): the same database_id. Each live
# channel reads its raffle from it.
[[d1_databases]]
binding = "DB"
database_name = "rafi"
database_id = "00000000-0000-0000-0000-000000000000"

# One live channel per raffle. The class is this Worker's.
[[durable_objects.bindings]]
name = "RAFFLE_ROOM"
class_name = "RaffleRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaffleRoom"]

# The live channels' application log lines are kept in Workers Logs; the
# automatic per-invocation records are not.
[observability]
enabled = true

[observability.logs]
invocation_logs = false

# Optional: the jurisdiction of the live channels' Durable Objects ("eu"),
# as wrangler.app.toml and wrangler.engine.toml say; unset, none. Before the
# first deploy only: INSTALL.md, "Keeping data in the EU".
[vars]
# RAFI_DO_JURISDICTION = "eu"
