# The live Worker: the raffles' live channels (the RaffleRoom Durable
# Objects), reached only through the other two Workers' bindings. Deploying it
# drops every live connection; any edit of this file redeploys it.
# Docs: README.md, INSTALL.md, and
# https://github.com/sagikazarmark/rafi/blob/main/docs/operations/cloudflare.md

name = "rafi-live"
main = "release/live/build/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

# Your database; the same ID in all three files.
[[d1_databases]]
binding = "DB"
database_name = "rafi"
database_id = "00000000-0000-0000-0000-000000000000"

[[durable_objects.bindings]]
name = "RAFFLE_ROOM"
class_name = "RaffleRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaffleRoom"]

[observability]
enabled = true

[observability.logs]
invocation_logs = false

[vars]
# Optional, before the first deploy only, the same in all three files
# (INSTALL.md, "Keeping data in the EU").
# RAFI_DO_JURISDICTION = "eu"
