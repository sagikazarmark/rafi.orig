# Rafi's app Worker (production): the web app and API, live-channel sockets,
# housekeeping, static files and rate limits. The engine (apps/worker-engine)
# and the RaffleRoom objects (apps/worker-live) are separate Workers.
# Locally, apps/worker runs all three.
#
# Nothing installation-specific lives here; an installation's copy is
# wrangler.app.toml (docs/operations/cloudflare.md), checked against this
# file in CI.

name = "rafi-app"
main = "build/index.js"
compatibility_date = "2026-10-01"
# The workers.dev address by default; a custom domain replaces it with a
# route. No preview URLs (they would share production's data).
workers_dev = true
preview_urls = false

[build]
command = "worker-build --release"

# The same static files as apps/worker. Other paths go to the Worker;
# /restate/ is a 404 here.
[assets]
directory = "../worker/worker-assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "rafi"
database_id = "00000000-0000-0000-0000-000000000000" # placeholder
migrations_dir = "../../migrations/sqlite"

# One live channel per raffle; the class and its migrations are the live
# Worker's.
[[durable_objects.bindings]]
name = "RAFFLE_ROOM"
class_name = "RaffleRoom"
script_name = "rafi-live"

# Soft limits, per location. Keys are never IP addresses: a venue shares
# one. The hard limit is RAFI_MAX_ENTRANTS.
[[ratelimits]]
name = "JOIN_PER_RAFFLE_LIMITER"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "JOIN_PER_EMAIL_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "CONNECT_LIMITER"
namespace_id = "1003"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "ADD_LIMITER"
namespace_id = "1004"
simple = { limit = 20, period = 60 }

# Housekeeping: erasing aged personal data, expired challenges, stale live
# channels (docs/explanation/privacy-and-abuse.md).
[triggers]
crons = ["0 * * * *"]

# Application log lines are kept; per-invocation records (client IPs,
# cookies) are not.
[observability]
enabled = true

[observability.logs]
invocation_logs = false

# Optional settings are as in apps/worker/wrangler.toml.
[vars]
# Optional: RAFI_DO_JURISDICTION = "eu", matching the engine's and the live
# Worker's.

# As apps/worker/wrangler.toml, minus RESTATE_IDENTITY_KEYS (the engine's).
[secrets]
required = [
  "RAFI_PUBLIC_URL",
  "RESTATE_INGRESS_URL",
  "RESTATE_INGRESS_API_KEY",
  "RAFI_POW_KEY",
  "CLERK_SECRET_KEY",
  "CLERK_PUBLISHABLE_KEY",
  "RAFI_OPERATOR_NAME",
  "RAFI_OPERATOR_EMAIL",
]
