[package]
name = "rafi-worker-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rafi's app Worker on Cloudflare (production): rafi-cloudflare-app's routes and live channels, and the housekeeping Cron, without the raffle engine or the RaffleRoom class, which it binds from the rooms Worker (worker-build)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Everything here is Workers glue: the crate is empty on other targets.
[target.'cfg(target_arch = "wasm32")'.dependencies]
http = "1"
rafi-cloudflare = { workspace = true }
rafi-cloudflare-app = { workspace = true }
worker = { workspace = true, features = ["http"] }
