[package]
name = "rafi-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rafi on Cloudflare Workers for local development: the app and the raffle engine in one Worker (rafi-cloudflare-app, rafi-cloudflare-engine under /restate), the housekeeping Cron and the RaffleRoom Durable Object (worker-build)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
## Local development only: allows RAFI_DEV_AUTH, the mock drand chain
## (RAFI_DRAND_MOCK) and Restate requests without identity keys.
dev = ["rafi-cloudflare-app/dev", "rafi-cloudflare-engine/dev"]

# Everything here is Workers glue: the crate is empty on other targets.
[target.'cfg(target_arch = "wasm32")'.dependencies]
http = "1"
# `object`: the RaffleRoom class is this Worker's own (production's is the
# live Worker's, apps/worker-live).
rafi-cloudflare = { workspace = true, features = ["object"] }
rafi-cloudflare-app = { workspace = true }
rafi-cloudflare-engine = { workspace = true }
worker = { workspace = true, features = ["http"] }
