[package]
name = "rafi-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rafi's app on Cloudflare Workers: rafi-server's routes, the retention Cron and the RaffleRoom Durable Object (worker-build)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
## Local development only: allows RAFI_DEV_AUTH and RAFI_DRAND_CHAIN=mock.
dev = ["rafi-server/mock-drand"]

[dependencies]

# Everything here is Workers glue: the crate is empty on other targets.
[target.'cfg(target_arch = "wasm32")'.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false }
dioxus-clerk = { version = "0.6", features = ["server", "worker"] }
http = "1"
rafi-app = { workspace = true }
rafi-cloudflare = { workspace = true, features = ["room"] }
rafi-engine = { workspace = true }
rafi-live-server = { workspace = true }
rafi-server = { workspace = true }
tower-service = "0.3"
worker = { version = "0.8.7", features = ["http", "axum"] }
