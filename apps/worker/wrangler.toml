# Rafi as one Worker: the app, the raffle engine and the live channels.
# The top level is the combined production shape, checked in CI; [env.dev]
# is local development. Production runs three Workers instead
# (apps/worker-app, apps/worker-engine, apps/worker-live).
#
# Nothing installation-specific lives here: one build serves every
# installation. An installation's values are secrets (listed under
# [secrets]), its database ID is in its own deploy configuration, and its
# legal documents, if any, are legal/terms.md and legal/privacy.md among the
# static files. See docs/operations/cloudflare.md.

name = "rafi"
main = "build/index.js"
compatibility_date = "2026-10-01"
# No address, and no preview URLs (they would share production's data).
workers_dev = false
preview_urls = false

[build]
command = "worker-build --release"

# The web app's files, participant scripts and legal documents. Other paths
# go to the Worker (routes, the web app's shell, /restate/). No single-page
# fallback: a missing file is a 404.
[assets]
directory = "./worker-assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "rafi"
database_id = "00000000-0000-0000-0000-000000000000" # placeholder
migrations_dir = "../../migrations/sqlite"

# One live channel per raffle.
[[durable_objects.bindings]]
name = "RAFFLE_ROOM"
class_name = "RaffleRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaffleRoom"]

# Soft limits, per location. Keys are never IP addresses: a venue shares
# one. The hard limit is RAFI_MAX_ENTRANTS.
[[ratelimits]]
name = "JOIN_PER_RAFFLE_LIMITER"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "JOIN_PER_EMAIL_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "CONNECT_LIMITER"
namespace_id = "1003"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "ADD_LIMITER"
namespace_id = "1004"
simple = { limit = 20, period = 60 }

# Housekeeping: erasing aged personal data, expired challenges, stale live
# channels (docs/explanation/privacy-and-abuse.md).
[triggers]
crons = ["0 * * * *"]

# Application log lines are kept; per-invocation records (client IPs,
# cookies) are not.
[observability]
enabled = true

[observability.logs]
invocation_logs = false

# Optional settings with defaults (RAFI_RETENTION_DAYS,
# RAFI_RETENTION_MAX_DAYS, RAFI_RETENTION_WINNERS_DAYS, RAFI_MIN_AGE,
# RAFI_DRAND_RELAYS, RAFI_DRAND_LEAD_SECS, RAFI_DRAND_TIMEOUT_SECS) are set
# as secrets when changed.
[vars]
# Optional: RAFI_DO_JURISDICTION = "eu" places the live channels in that
# jurisdiction (not supported locally).

# Required before a deploy:
#   RAFI_PUBLIC_URL                        public origin, no trailing slash
#   RESTATE_INGRESS_URL                    Restate Cloud ingress URL
#   RESTATE_INGRESS_API_KEY                API key with ingress access
#   RESTATE_IDENTITY_KEYS                  Restate public key(s), comma separated
#   RAFI_POW_KEY                           random, 32+ chars; never rotate mid-event
#   CLERK_SECRET_KEY, CLERK_PUBLISHABLE_KEY
#   RAFI_OPERATOR_NAME, RAFI_OPERATOR_EMAIL   the processor named in notices
[secrets]
required = [
  "RAFI_PUBLIC_URL",
  "RESTATE_INGRESS_URL",
  "RESTATE_INGRESS_API_KEY",
  "RESTATE_IDENTITY_KEYS",
  "RAFI_POW_KEY",
  "CLERK_SECRET_KEY",
  "CLERK_PUBLISHABLE_KEY",
  "RAFI_OPERATOR_NAME",
  "RAFI_OPERATOR_EMAIL",
]

# Local development (docs/development/getting-started.md). Environments
# don't inherit bindings, so they're repeated; no secrets are required.
[env.dev]
workers_dev = true

[env.dev.secrets]
required = []

[env.dev.build]
command = "worker-build --release --features dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "rafi"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../migrations/sqlite"

[[env.dev.durable_objects.bindings]]
name = "RAFFLE_ROOM"
class_name = "RaffleRoom"

[[env.dev.ratelimits]]
name = "JOIN_PER_RAFFLE_LIMITER"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[env.dev.ratelimits]]
name = "JOIN_PER_EMAIL_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[env.dev.ratelimits]]
name = "CONNECT_LIMITER"
namespace_id = "1003"
simple = { limit = 600, period = 60 }

[[env.dev.ratelimits]]
name = "ADD_LIMITER"
namespace_id = "1004"
simple = { limit = 20, period = 60 }

[env.dev.vars]
RAFI_PUBLIC_URL = "http://127.0.0.1:8787"
RESTATE_INGRESS_URL = "http://127.0.0.1:18080"
RAFI_DEV_AUTH = "1" # also stands in for the operator
RAFI_DRAND_MOCK = "1" # mock chain, for app and engine
RAFI_DRAND_LEAD_SECS = "3"
RAFI_POW_KEY = "local-development-only"
