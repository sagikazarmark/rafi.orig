# Rafi on Cloudflare Workers: the app and the raffle engine in one Worker. The
# top level is production; `[env.dev]` is local development (`wrangler dev --env dev`).
#
# Before the first deploy:
#   wrangler d1 create rafi --jurisdiction eu      # then put its ID below
#   wrangler d1 migrations apply rafi --remote
#   wrangler secret put RAFI_ALTCHA_KEY            # random, 32+ bytes; never rotate during an event
#   wrangler secret put CLERK_SECRET_KEY
#   wrangler secret put RESTATE_API_KEY            # Restate Cloud ingress
#   wrangler secret put RESTATE_IDENTITY_KEYS      # the Restate environment's public key(s)
# and build the static files: ./scripts/app-assets.sh
# After each deploy, register https://<this Worker's host>/restate with Restate.

name = "rafi"
main = "build/index.js"
compatibility_date = "2026-05-01"
# Only the custom domain: no *.workers.dev address, no public preview URLs
# (previews would share production's database and objects).
workers_dev = false
preview_urls = false

[build]
command = "worker-build --release"

# The web app (admin, projector, verification page) and the participant scripts.
# Paths the Worker answers go to it first (Restate's requests under /restate/
# included); anything else is a file, or the web app's index.html (single-page
# routing). The Worker serves the participant page's proof-of-work solver
# (dioxus-altcha's, as built in).
[assets]
directory = "./worker-assets"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/j/*", "/rules/*", "/privacy", "/privacy/*", "/terms", "/partyline/*", "/restate", "/restate/*", "/healthz", "/participant/altcha-worker.js"]

[[d1_databases]]
binding = "DB"
database_name = "rafi"
database_id = "00000000-0000-0000-0000-000000000000" # `wrangler d1 create rafi --jurisdiction eu`
migrations_dir = "../../migrations/sqlite"

# One live channel per raffle; IDs come from the EU jurisdiction (RAFI_DO_JURISDICTION).
[[durable_objects.bindings]]
name = "RAFFLE_ROOM"
class_name = "RaffleRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaffleRoom"]

# Soft limits (approximate, per location). Keys are never IP addresses: a
# venue shares one. The hard limit is the entrant cap (RAFI_MAX_ENTRANTS).
[[ratelimits]]
name = "JOIN_PER_RAFFLE_LIMITER"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "JOIN_PER_EMAIL_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "CONNECT_LIMITER"
namespace_id = "1003"
simple = { limit = 600, period = 60 }

# Housekeeping: erasing personal data as raffles age (see docs/explanation/privacy-and-abuse.md),
# expired proof-of-work challenges, ending stale live channels.
[triggers]
crons = ["0 * * * *"]

# No invocation logs: they would record client IPs and cookies.
[observability]
enabled = false

# The engine's drand settings (RAFI_DRAND_RELAYS, RAFI_DRAND_LEAD_SECS,
# RAFI_DRAND_TIMEOUT_SECS) go here too when they differ from the defaults.
[vars]
RAFI_PUBLIC_URL = "https://rafi.example" # the public origin, no trailing slash
RESTATE_INGRESS_URL = "" # Restate Cloud ingress URL (EU)
RAFI_DO_JURISDICTION = "eu"
# Who runs this installation: named as the processor in every raffle's privacy
# notice. The documents themselves are legal/terms.md and legal/privacy.md,
# bundled into the Worker; bump a version whenever its text changes.
RAFI_OPERATOR_NAME = "" # required
RAFI_OPERATOR_EMAIL = "" # required
RAFI_TERMS_VERSION = "" # required, e.g. "2026-10"
RAFI_PRIVACY_VERSION = "" # required
# When personal data is erased: days after the event date for non-winners
# (default 7, organizers may shorten; at most RAFI_RETENTION_DAYS_MAX, 30),
# and how long winners are held past that unless their prize is marked
# delivered (90). RAFI_MIN_AGE (16) is what entrants confirm by entering.

# Local development: wrangler dev --env dev (see README). Bindings aren't
# inherited by environments, so they're repeated.
[env.dev]
workers_dev = true

[env.dev.build]
command = "worker-build --release --features dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "rafi"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../migrations/sqlite"

[[env.dev.durable_objects.bindings]]
name = "RAFFLE_ROOM"
class_name = "RaffleRoom"

[[env.dev.ratelimits]]
name = "JOIN_PER_RAFFLE_LIMITER"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[env.dev.ratelimits]]
name = "JOIN_PER_EMAIL_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[env.dev.ratelimits]]
name = "CONNECT_LIMITER"
namespace_id = "1003"
simple = { limit = 600, period = 60 }

[env.dev.vars]
RAFI_PUBLIC_URL = "http://127.0.0.1:8787"
RESTATE_INGRESS_URL = "http://127.0.0.1:18080"
RAFI_DO_JURISDICTION = "" # workerd doesn't implement jurisdictions
RAFI_DEV_AUTH = "1" # also stands in for the operator and the document versions
RAFI_DRAND_MOCK = "1" # the mock chain, for the app and the engine alike
RAFI_DRAND_LEAD_SECS = "3"
RAFI_ALTCHA_KEY = "local-development-only"
