# Rafi on Cloudflare Workers: the app and the raffle engine in one Worker. The
# top level is production's shape; `[env.dev]` is local development
# (`wrangler dev --env dev`).
#
# Nothing of one installation's is in this file: it is the Worker's shape,
# for development (`[env.dev]`, under `wrangler dev`) and CI (a dry deploy).
# An installation deploys the same shape from its copy of deploy/cloudflare/
# (its wrangler.toml points at a release's files), with its database ID in
# it; everything else of the installation's is a secret (`wrangler secret
# bulk`; the Worker reads vars and secrets alike), listed under [secrets] so a
# deploy refuses to go out without them, or a file among the static files:
# the legal documents are `legal/terms.md` and `legal/privacy.md` there,
# which scripts/app-assets.sh copies in from RAFI_DOCS_DIR, and the Worker
# reads them through the assets binding when an isolate starts. Nothing of
# an installation's is compiled in: one build serves every installation.
# scripts/workers-check.sh checks that the two files agree on the Worker's
# paths and required secrets. The full procedure: docs/operations/cloudflare.md.

name = "rafi"
main = "build/index.js"
compatibility_date = "2026-05-01"
# Only the custom domain: no *.workers.dev address, no public preview URLs
# (previews would share production's database and objects).
workers_dev = false
preview_urls = false

[build]
command = "worker-build --release"

# The web app (admin, projector, verification page), the participant scripts
# and the installation's legal documents (legal/). Paths the Worker answers go
# to it first (Restate's requests under /restate/ included); anything else is
# a file, or the web app's index.html (single-page routing). The Worker serves
# the web app's configuration (/config.js) and the participant page's
# proof-of-work solver (dioxus-altcha's, as built in). /__scheduled is
# `wrangler dev --test-scheduled`'s way of firing the Cron Trigger
# (scripts/workers-check.sh); in production it is a path like any other,
# which the Worker answers 404. The binding is how the Worker reads the legal
# documents.
[assets]
directory = "./worker-assets"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/config.js", "/j/*", "/rules/*", "/privacy", "/privacy/*", "/terms", "/partyline/*", "/restate", "/restate/*", "/healthz", "/participant/altcha-worker.js", "/__scheduled"]

[[d1_databases]]
binding = "DB"
database_name = "rafi"
database_id = "00000000-0000-0000-0000-000000000000" # a placeholder: an installation's is in its deploy/cloudflare copy
migrations_dir = "../../migrations/sqlite"

# One live channel per raffle; IDs come from the EU jurisdiction (RAFI_DO_JURISDICTION).
[[durable_objects.bindings]]
name = "RAFFLE_ROOM"
class_name = "RaffleRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaffleRoom"]

# Soft limits (approximate, per location). Keys are never IP addresses: a
# venue shares one. The hard limit is the entrant cap (RAFI_MAX_ENTRANTS).
[[ratelimits]]
name = "JOIN_PER_RAFFLE_LIMITER"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "JOIN_PER_EMAIL_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "CONNECT_LIMITER"
namespace_id = "1003"
simple = { limit = 600, period = 60 }

# Housekeeping: erasing personal data as raffles age (see docs/explanation/privacy-and-abuse.md),
# expired proof-of-work challenges, ending stale live channels.
[triggers]
crons = ["0 * * * *"]

# The application's own log lines (warnings and errors, raffle IDs and error
# text, never personal data; the hourly housekeeping report) are kept in
# Workers Logs. The automatic per-invocation records are not: they would
# hold client IPs and cookies. `wrangler tail` shows both live, whatever is
# set here.
[observability]
enabled = true

[observability.logs]
invocation_logs = false

# What belongs to Rafi, not to an installation. An installation's own values
# are secrets (below); optional settings with defaults (RAFI_RETENTION_DAYS,
# RAFI_RETENTION_MAX_DAYS, RAFI_RETENTION_WINNERS_DAYS, RAFI_MIN_AGE,
# RAFI_DRAND_RELAYS, RAFI_DRAND_LEAD_SECS, RAFI_DRAND_TIMEOUT_SECS) are
# secrets too when an installation changes them.
[vars]
RAFI_DO_JURISDICTION = "eu"

# What every installation must set before its first deploy, with
# `wrangler secret bulk <file>` or `wrangler secret put <NAME>`:
#   RAFI_PUBLIC_URL                        the public origin, no trailing slash
#   RAFI_ENGINE_INGRESS_URL                Restate Cloud's ingress URL (EU)
#   RAFI_ENGINE_API_KEY                    a Restate Cloud API key with ingress access
#   RAFI_RESTATE_ENDPOINT__IDENTITY_KEYS   the Restate environment's public key(s), comma separated
#   RAFI_ALTCHA_KEY                        random, 32+ characters; never rotate during an event
#   CLERK_SECRET_KEY
#   CLERK_PUBLISHABLE_KEY                  not secret (the web app gets it from /config.js), but the installation's
#   RAFI_OPERATOR_NAME, RAFI_OPERATOR_EMAIL   named as the processor in every raffle's notice
#   RAFI_TERMS_VERSION, RAFI_PRIVACY_VERSION  the documents' versions, e.g. "2026-10"
# A deploy refuses to go out while one is missing.
[secrets]
required = [
  "RAFI_PUBLIC_URL",
  "RAFI_ENGINE_INGRESS_URL",
  "RAFI_ENGINE_API_KEY",
  "RAFI_RESTATE_ENDPOINT__IDENTITY_KEYS",
  "RAFI_ALTCHA_KEY",
  "CLERK_SECRET_KEY",
  "CLERK_PUBLISHABLE_KEY",
  "RAFI_OPERATOR_NAME",
  "RAFI_OPERATOR_EMAIL",
  "RAFI_TERMS_VERSION",
  "RAFI_PRIVACY_VERSION",
]

# Local development: wrangler dev --env dev (docs/development/getting-started.md).
# Bindings aren't inherited by environments, so they're repeated; the
# required secrets are, as an empty list, so dev isn't asked for production's.
[env.dev]
workers_dev = true

[env.dev.secrets]
required = []

[env.dev.build]
command = "worker-build --release --features dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "rafi"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../migrations/sqlite"

[[env.dev.durable_objects.bindings]]
name = "RAFFLE_ROOM"
class_name = "RaffleRoom"

[[env.dev.ratelimits]]
name = "JOIN_PER_RAFFLE_LIMITER"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[env.dev.ratelimits]]
name = "JOIN_PER_EMAIL_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[env.dev.ratelimits]]
name = "CONNECT_LIMITER"
namespace_id = "1003"
simple = { limit = 600, period = 60 }

[env.dev.vars]
RAFI_PUBLIC_URL = "http://127.0.0.1:8787"
RAFI_ENGINE_INGRESS_URL = "http://127.0.0.1:18080"
RAFI_DO_JURISDICTION = "none" # workerd doesn't implement jurisdictions
RAFI_DEV_AUTH = "1" # also stands in for the operator and the document versions
RAFI_DRAND_MOCK = "1" # the mock chain, for the app and the engine alike
RAFI_DRAND_LEAD_SECS = "3"
RAFI_ALTCHA_KEY = "local-development-only"
