[package]
name = "rafi-worker-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rafi's raffle engine Worker on Cloudflare (production): rafi-cloudflare-engine's Restate endpoint under /restate, and nothing else (worker-build)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Everything here is Workers glue: the crate is empty on other targets. Only
# the engine's library: nothing of the app's, no RaffleRoom (`just
# clippy-wasm` checks).
[target.'cfg(target_arch = "wasm32")'.dependencies]
http = "1"
rafi-cloudflare-engine = { workspace = true }
worker = { workspace = true, features = ["http"] }
