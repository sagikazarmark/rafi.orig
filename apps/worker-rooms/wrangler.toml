# Rafi's rooms Worker on Cloudflare (production): the raffles' live channels,
# one RaffleRoom Durable Object per raffle. The class is this Worker's, with
# its Durable Object migrations; the app Worker (apps/worker-app) and the
# engine Worker (apps/worker-engine) bind it by this Worker's name,
# `rafi-rooms` (script_name). It has no address of its own and no secrets: it
# is reached only through those bindings. Local development hosts the class
# in the combined Worker (apps/worker).
#
# The Worker's shape, for building and a dry deploy (`just dry-run`): nothing
# of an installation's is in it. An installation's configuration comes with
# the release (docs/operations/cloudflare.md).

name = "rafi-rooms"
main = "build/index.js"
compatibility_date = "2026-10-01"
# No address: no route, no *.workers.dev, no preview URLs. The objects are
# reached through the other Workers' bindings.
workers_dev = false
preview_urls = false

[build]
command = "worker-build --release"

# The app's database: each object reads its raffle from it.
[[d1_databases]]
binding = "DB"
database_name = "rafi"
database_id = "00000000-0000-0000-0000-000000000000" # a placeholder: the app's, in an installation's deploy configuration
migrations_dir = "../../migrations/sqlite"

# One live channel per raffle; IDs come from the EU jurisdiction (RAFI_DO_JURISDICTION).
# The class is this Worker's; the app's and the engine's Workers bind it
# with script_name = "rafi-rooms".
[[durable_objects.bindings]]
name = "RAFFLE_ROOM"
class_name = "RaffleRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaffleRoom"]

# The objects' application log lines are kept in Workers Logs; the automatic
# per-invocation records are not.
[observability]
enabled = true

[observability.logs]
invocation_logs = false

# The objects' jurisdiction, as the app's and the engine's say (they create
# the objects' IDs in it).
[vars]
RAFI_DO_JURISDICTION = "eu"
