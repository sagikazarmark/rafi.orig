# Rafi's live Worker (production): one RaffleRoom Durable Object per raffle.
# It owns the class and its migrations; the app and engine Workers bind it
# by name. No address, no secrets. Locally, apps/worker hosts the class.
#
# Nothing installation-specific lives here; an installation's copy is
# wrangler.live.toml (docs/operations/cloudflare.md), checked against this
# file in CI.

name = "rafi-live"
main = "build/index.js"
compatibility_date = "2026-10-01"
# Reached only through other Workers' bindings.
workers_dev = false
preview_urls = false

[build]
command = "worker-build --release"

# Each object reads its raffle from the app's database.
[[d1_databases]]
binding = "DB"
database_name = "rafi"
database_id = "00000000-0000-0000-0000-000000000000" # placeholder
migrations_dir = "../../migrations/sqlite"

# One live channel per raffle.
[[durable_objects.bindings]]
name = "RAFFLE_ROOM"
class_name = "RaffleRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaffleRoom"]

# Application log lines are kept; per-invocation records are not.
[observability]
enabled = true

[observability.logs]
invocation_logs = false

# Optional: RAFI_DO_JURISDICTION, matching the app's and the engine's.
[vars]
# RAFI_DO_JURISDICTION = "eu"
