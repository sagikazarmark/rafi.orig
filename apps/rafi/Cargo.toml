[package]
name = "rafi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rafi's native server: rafi-server's routes and the web app's files over HTTP (axum)"
publish = false

[[bin]]
name = "rafi"
path = "src/main.rs"
doc = false

[features]
## Allow `RAFI_DRAND_CHAIN=mock` (or `RAFI_DRAND_MOCK=1`): raffles commit to a
## public test chain (offline development). Release builds refuse it.
mock-drand = ["rafi-server/mock-drand"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
dioxus-clerk = { version = "0.7", features = ["server"] }
rafi-server = { workspace = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
