<!DOCTYPE html>
<html lang="en">
    <head>
        <title>{app_title}</title>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta charset="UTF-8">
        <meta name="color-scheme" content="light dark">
        <script>
            // Apply the saved theme before first paint (no flash). "system" = no attribute.
            try { var t = localStorage.getItem("rafi-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
        </script>
        <!-- The server's configuration for the app (rafi-server's public::config_js): a plain script, so it
             has run before the app's module starts. -->
        <script src="/config.js"></script>
        <!-- Styled first paint, before the app loads (rafi-server's pages::style::STYLESHEET_URL). -->
        <link rel="stylesheet" href="/assets/tailwind.css">
    </head>
    <body>
        <div id="main"></div>
    </body>
</html>
